<header class="header position-relative z-3 py-3">
  <div class="container">
    <div class="row g-0 align-items-center">
      <div class="col d-none d-lg-block">
        <div class="d-flex justify-content-end align-items-center gap-4 pb-3 pe-4 border-bottom border-secondary">
          <a href="#" class="link-light"><i class="bi bi-facebook"></i></a>
          <a href="#" class="link-light"><i class="bi bi-twitter-x"></i></a>
          <a href="#" class="link-light"><i class="bi bi-instagram"></i></a>
          <a href="#" class="link-light"><i class="bi bi-youtube"></i></a>
        </div>
        <ul class="nav justify-content-end gap-3 pt-3 pe-3">
          <li class="nav-item"><a class="nav-link link-light px-2" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Anasayfa</a></li>
          <li class="nav-item"><a class="nav-link link-light px-2" href="#">Branşlar</a></li>
          <li class="nav-item"><a class="nav-link link-light px-2" href="#">Hakkımızda</a></li>
        </ul>
      </div>

      <div class="col-auto px-lg-3">
        <a routerLink="/"><img src="assets/image/logo.png" height="110" alt="Yenilmez Yetenekler" /></a>
      </div>

      <div class="col">
        <div class="d-flex justify-content-end justify-content-lg-start align-items-center gap-4 pb-lg-3 ps-4 border-lg-bottom">
          <a routerLink="/login" class="nav-link link-light d-none d-lg-block">Giriş Yap</a>
          <a routerLink="/register" class="nav-link link-light d-none d-lg-block">Kayıt Ol</a>

          <a href="#" class="link-light fs-4 d-lg-none"><i class="bi bi-list"></i></a>
        </div>
        <ul class="nav gap-3 pt-3 ps-3 d-none d-lg-flex">
          <li class="nav-item"><a class="nav-link link-light px-2" href="#">Galeri</a></li>
          <li class="nav-item"><a class="nav-link link-light px-2" href="#">İletişim</a></li>
          <li class="nav-item"><a class="nav-link link-light px-2" href="#">Hesabım</a></li>
          <li class="nav-item"><a class="nav-link link-light px-2 fs-5 lh-1" href="#"><i class="bi bi-list"></i></a></li>
        </ul>
      </div>
    </div>
